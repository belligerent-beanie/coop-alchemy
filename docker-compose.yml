# Co-op Alchemy and its Cloudflare Tunnel as one unit.
#
# The game service has been built and run from this file on Docker Desktop for Windows (2026-11-07); the tunnel service has not,
# since that needs a real token. See DEPLOYMENT.md, "Moving to Cloudflare Tunnel and an external host".
#
#   cp .env.example .env        # then put your tunnel token in .env
#   docker compose up -d --build
#
# The game publishes no port at all: the only way in is the tunnel, which reaches it at http://alchemy:8000 (set that as the
# public hostname's service in the Cloudflare dashboard). The tunnel's connection arrives from a private Docker address, so those
# ranges are trusted proxies here, and Cloudflare's CF-Connecting-IP header says who the visitor really is.
services:
  alchemy:
    build: .
    restart: unless-stopped
    volumes:
      - alchemy-data:/data
    # Hardening: if the game were ever broken into, these limit what the intruder can do and how much of the host they can use.
    #   read_only + tmpfs  nothing can be written outside /data (and a scratch /tmp that vanishes on restart). NOT TRIED on a real
    #                      server: if the container will not start after this change, remove the next two lines first.
    #   cap_drop, no-new-privileges  no special Linux powers, and none can be gained later.
    #   mem_limit, cpus, pids_limit  a flood or a bug cannot eat the whole server (sized for 1 CPU and 2 GB; raise them on a bigger one).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 0.8
    pids_limit: 1024   # the server allows 600 connections at once and each takes a thread (--max-connections), plus its own helper threads
    command:
      - "--trusted-proxy"
      - "172.16.0.0/12"
      - "--trusted-proxy"
      - "10.0.0.0/8"
      - "--trusted-proxy"
      - "192.168.0.0/16"
      - "--client-ip-header"
      - "CF-Connecting-IP"
      - "--max-games"
      - "10"
      - "--require-invite"
      - "--contact"
      - "${CONTACT_ADDRESS:-}"
    # Optional gates (see DEPLOYMENT.md): add "--turnstile-site-key", "<key>" above and uncomment the secret below.
    # environment:
    #   - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}

  tunnel:
    image: cloudflare/cloudflared:2026.11.1   # pinned so an update never surprises you; bump it on purpose (releases: github.com/cloudflare/cloudflared)
    restart: unless-stopped
    # Hardened the same way as the game, and just as UNTRIED: if the tunnel will not start, remove read_only first.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?put TUNNEL_TOKEN in .env}
    depends_on:
      - alchemy

volumes:
  alchemy-data:
