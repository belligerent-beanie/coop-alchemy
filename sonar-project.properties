# SonarQube Cloud project. Confirm the two values below match the project you import at https://sonarcloud.io
sonar.organization=belligerent-beanie
sonar.projectKey=belligerent-beanie_coop-alchemy
sonar.projectName=coop-alchemy

sonar.sourceEncoding=UTF-8
sonar.python.version=3.10,3.11,3.12,3.13

# Game code: the Python modules in the root, ops/ and aigen/, plus the browser code in static/ and extension/.
sonar.sources=.
sonar.exclusions=design/**,_private-backup-*/**,_transfer/**,touch-check-output/**,**/*.json,**/*.svg,**/*.png
sonar.tests=.
sonar.test.inclusions=test_*.py
# Test files are analysed as tests, not as shipped code, and are not measured for coverage or duplication.
sonar.coverage.exclusions=test_*.py,bench_*.py,touch_check.py,ops/**,design/**
sonar.cpd.exclusions=test_*.py,static/*.js

# Reports produced by CI (.github/workflows/ci.yml)
sonar.python.coverage.reportPaths=coverage.xml
# Ruff is the single authority on Python lint: its findings are imported and shown (and gated) alongside Sonar's own.
sonar.python.ruff.reportPaths=ruff-report.json
