name: Agent fix

# Adding the `agent` label to an issue hands it to Claude (Sonnet), which fixes it on a branch and opens a PR.
# Only people with write access can add labels, so only they can start it. See AGENTS.md.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write   # the Claude GitHub App's token is exchanged through OIDC; its PRs then trigger CI

concurrency:
  group: agent-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    name: Fix issue
    if: github.event.label.name == 'agent' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Acknowledge the issue
        continue-on-error: true   # a cosmetic comment must never stop the fix
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "🤖 Picked up by the agent (Claude Sonnet 5.5). Working on it now: [run log]($RUN_URL). I'll comment again when it finishes."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: "pip install --require-hashes --only-binary :all: -r requirements-ci.txt"
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}

            Read .github/agents/fixer.md and follow it to resolve issue #${{ github.event.issue.number }}.
            Start with `gh issue view ${{ github.event.issue.number }}`.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(python3 run_tests.py:*),Bash(python3 -m unittest:*),Bash(ruff check:*),Bash(node --check:*)"
      - name: Report the outcome on the issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          started=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json createdAt --jq .createdAt)
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "agent/issue-$ISSUE" --state open --json number,createdAt --jq "[.[] | select(.createdAt >= \"$started\")][0].number // empty")
          if [ -n "$pr" ]; then
            msg="🤖 Done: opened PR #$pr. It gets an automated review next; you merge."
          elif [ "$JOB_STATUS" = "success" ]; then
            msg="🤖 Finished without opening a PR. If the fix looked risky or large, the reason is in the comment above; otherwise see the [run log]($RUN_URL)."
          else
            msg="🤖 The run ended with status \`$JOB_STATUS\` and no PR. See the [run log]($RUN_URL). Remove and re-add \`agent\` to retry."
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$msg"
